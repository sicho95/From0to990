openapi: 3.1.0
info:
  title: From0to990 Sync API
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      summary: Health + CORS test
      responses: {'200': {description: OK}}
  /api/v1/sync:
    options:
      summary: CORS preflight
      responses: {'204': {description: No content}}
    post:
      summary: Push local events and pull newer remote events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, events]
              properties:
                deviceId: {type: string}
                cursor: {type: [string, 'null']}
                events: {type: array, items: {type: object}}
      responses: {'200': {description: Sync result}}
  /api/v1/admin/export:
    get:
      summary: Complete portable database export
      security: [{bearerAuth: []}]
      responses: {'200': {description: Complete JSON dump}}
  /api/v1/admin/import:
    post:
      summary: Validate or import a portable dump
      parameters:
        - in: query
          name: mode
          schema: {type: string, enum: [validate, merge, replace]}
      security: [{bearerAuth: []}]
      responses: {'200': {description: Import report}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
