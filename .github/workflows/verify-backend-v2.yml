name: Verify backend v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-backend-v2.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live API v2
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://from0to990-api.sicho95.chatgpt.site'
          ORIGIN='https://sicho95.github.io'
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          req() {
            local name="$1"; shift
            local code
            code=$(curl -sS -o "$TMP/$name.body" -D "$TMP/$name.headers" -w '%{http_code}' "$@")
            echo "$name status=$code"
            echo "--- $name headers ---"
            sed -n '1,30p' "$TMP/$name.headers"
            echo "--- $name body ---"
            cat "$TMP/$name.body" || true
            echo
            printf '%s' "$code" > "$TMP/$name.code"
          }

          req health "$BASE/api/v1/health"
          test "$(cat "$TMP/health.code")" = "200"
          node -e '
            const fs=require("fs");
            const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            if(j.status!=="ok"||j.database!=="ok") throw new Error("health not ok");
            if(Number(j.schema_version)<2) throw new Error("schema_version < 2");
            if(Number(j.auth_version)!==2) throw new Error("auth_version != 2");
            console.log("HEALTH_OK", JSON.stringify(j));
          ' "$TMP/health.body"

          req cors -X OPTIONS "$BASE/api/v1/auth/login"             -H "Origin: $ORIGIN"             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,authorization'
          CORS_CODE="$(cat "$TMP/cors.code")"
          test "$CORS_CODE" = "204" -o "$CORS_CODE" = "200"
          grep -qi '^access-control-allow-origin: https://sicho95.github.io' "$TMP/cors.headers"
          grep -qi '^access-control-allow-headers:.*authorization' "$TMP/cors.headers"
          grep -qi '^access-control-allow-methods:.*POST' "$TMP/cors.headers"

          req badorigin -X OPTIONS "$BASE/api/v1/auth/login"             -H 'Origin: https://example.com'             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,authorization'
          if grep -qi '^access-control-allow-origin: https://example.com' "$TMP/badorigin.headers"; then
            echo 'ERROR: untrusted origin allowed'
            exit 1
          fi

          req me "$BASE/api/v1/auth/me" -H "Origin: $ORIGIN"
          test "$(cat "$TMP/me.code")" = "401"

          req sync -X POST "$BASE/api/v1/sync"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"deviceId":"verify-runner","events":[]}'
          test "$(cat "$TMP/sync.code")" = "401"

          req admin "$BASE/api/v1/admin/users" -H "Origin: $ORIGIN"
          ADMIN_CODE="$(cat "$TMP/admin.code")"
          test "$ADMIN_CODE" = "401" -o "$ADMIN_CODE" = "403"

          req login -X POST "$BASE/api/v1/auth/login"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"identifier":"definitely-not-a-real-from0to990-user","password":"NotARealPassword123!","deviceId":"verify-runner"}'
          LOGIN_CODE="$(cat "$TMP/login.code")"
          test "$LOGIN_CODE" = "401" -o "$LOGIN_CODE" = "403" -o "$LOGIN_CODE" = "429"

          req register_invalid -X POST "$BASE/api/v1/auth/register"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"email":"not-an-email","username":"x","password":"short","deviceId":"verify-runner"}'
          REG_CODE="$(cat "$TMP/register_invalid.code")"
          test "$REG_CODE" = "400" -o "$REG_CODE" = "422" -o "$REG_CODE" = "429"

          req forgot -X POST "$BASE/api/v1/auth/password/forgot"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"email":"from0to990-verification-nonexistent@example.com"}'
          FORGOT_CODE="$(cat "$TMP/forgot.code")"
          test "$FORGOT_CODE" = "202" -o "$FORGOT_CODE" = "429"

          req reset_invalid -X POST "$BASE/api/v1/auth/password/reset"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"token":"invalid-verification-token","newPassword":"ThisPasswordIsLongEnough123!"}'
          RESET_CODE="$(cat "$TMP/reset_invalid.code")"
          test "$RESET_CODE" = "400" -o "$RESET_CODE" = "401" -o "$RESET_CODE" = "429"

          echo 'BACKEND_V2_PUBLIC_SECURITY_CHECKS_OK'
