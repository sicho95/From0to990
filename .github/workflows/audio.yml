name: Generate natural audio
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/curriculum.js'
      - 'scripts/generate-content.mjs'
      - 'scripts/export-audio-spec.mjs'
      - 'scripts/generate-audio.py'
      - '.github/workflows/audio.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: natural-audio
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system audio dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install Kokoro
        run: pip install "kokoro>=0.9.4" soundfile numpy
      - name: Build current question bank
        run: node scripts/generate-content.mjs
      - name: Export audio specification
        run: node scripts/export-audio-spec.mjs
      - name: Generate neural MP3 bank
        run: python scripts/generate-audio.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/audio-manifest.json public/audio/audio-spec.json public/audio/generated
          if git diff --cached --quiet; then
            echo "Audio bank already up to date."
          else
            git commit -m "chore: regenerate natural Kokoro audio bank"
            git push
          fi
