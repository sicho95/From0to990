name: Verify backend auth status
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-auth-status.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live auth status
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://from0to990-api.sicho95.chatgpt.site'
          ORIGIN='https://sicho95.github.io'
          echo "HEALTH=$(curl -sS "$BASE/api/v1/health")"
          code(){ curl -sS -o /dev/null -w '%{http_code}' "$@"; }
          echo "ME=$(code "$BASE/api/v1/auth/me" -H "Origin: $ORIGIN")"
          echo "SYNC=$(code -X POST "$BASE/api/v1/sync" -H "Origin: $ORIGIN" -H 'content-type: application/json' --data '{"deviceId":"verify","events":[]}')"
          echo "ADMIN=$(code "$BASE/api/v1/admin/users" -H "Origin: $ORIGIN")"
          echo "FORGOT=$(code -X POST "$BASE/api/v1/auth/password/forgot" -H "Origin: $ORIGIN" -H 'content-type: application/json' --data '{"email":"from0to990-healthcheck-nonexistent@example.com"}')"
          echo "CORS=$(code -X OPTIONS "$BASE/api/v1/auth/login" -H "Origin: $ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type,authorization')"
