name: Verify live auth readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-auth.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live backend safely
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://from0to990-api.sicho95.chatgpt.site'
          ORIGIN='https://sicho95.github.io'
          echo -n 'HEALTH='
          curl -fsS "$BASE/api/v1/health"
          echo
          echo -n 'SYNC_UNAUTH='
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST "$BASE/api/v1/sync"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"deviceId":"readiness-check","events":[]}'
          echo -n 'ME_UNAUTH='
          curl -sS -o /dev/null -w '%{http_code}\n' "$BASE/api/v1/auth/me" -H "Origin: $ORIGIN"
          echo -n 'ADMIN_UNAUTH='
          curl -sS -o /dev/null -w '%{http_code}\n' "$BASE/api/v1/admin/users" -H "Origin: $ORIGIN"
          echo -n 'FORGOT_NONEXISTENT='
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST "$BASE/api/v1/auth/password/forgot"             -H "Origin: $ORIGIN" -H 'content-type: application/json'             --data '{"email":"from0to990-readiness-nonexistent@example.com"}'
          echo 'CORS:'
          curl -sS -o /dev/null -D - -X OPTIONS "$BASE/api/v1/auth/login"             -H "Origin: $ORIGIN"             -H 'Access-Control-Request-Method: POST'             -H 'Access-Control-Request-Headers: content-type,authorization'             | grep -Ei '^(HTTP/|access-control-allow-origin:|access-control-allow-headers:|access-control-allow-methods:)'
